name: Test and build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"

      - name: Run tests
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-Setup
          path: packaging/windows/Output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/Output/*.exe
          # Shown behind "What's new" when the app offers the update.
          generate_release_notes: true
