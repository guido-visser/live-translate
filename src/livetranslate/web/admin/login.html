<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Live Translate</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body class="login-page">
  <header class="top">
    <h1>Live Translate</h1>
    <div class="top-actions">
      <select id="uiLang" aria-label="Language">
        <option value="nl">NL</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
        <option value="uk">UK</option>
      </select>
    </div>
  </header>

  <main class="login-main">
    <form id="loginForm" class="card login-card">
      <h2 data-t="loginTitle"></h2>
      <p class="small muted" data-t="loginHelp"></p>
      <div class="row">
        <label for="password" data-t="wsPassword"></label>
        <input id="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button id="loginBtn" type="submit" class="primary" data-t="loginButton"></button>
      <p id="loginError" class="error" role="alert" hidden></p>
    </form>
  </main>

  <script src="/admin/defaults.js"></script>
  <script src="/static/admin/i18n.js"></script>
  <script src="/static/admin/common.js"></script>
  <script src="/static/admin/login.js"></script>
</body>
</html>
