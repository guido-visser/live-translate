<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Translate</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
  <header class="top">
    <h1>Live Translate</h1>
    <div class="pills">
      <span id="statePill" class="pill"></span>
      <span id="trPill" class="pill"></span>
    </div>
    <div class="top-actions">
      <button id="perfBtn" class="icon-btn" type="button" aria-pressed="false"><span aria-hidden="true">📈</span> <span data-t="performance"></span></button>
      <button id="qrBtn" class="icon-btn" type="button"><span aria-hidden="true">▦</span> <span data-t="qr"></span></button>
      <a class="icon-btn" href="/admin/settings" data-pin-link><span aria-hidden="true">⚙</span> <span data-t="settings"></span></a>
      <select id="uiLang" aria-label="Language">
        <option value="nl">NL</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
        <option value="uk">UK</option>
      </select>
    </div>
  </header>

  <main class="grid main-grid">
    <section class="card controls">
      <div class="buttons">
        <button id="startBtn" class="big primary" type="button"></button>
        <button id="pauseBtn" class="big" type="button" disabled></button>
      </div>
      <div class="speaker-row">
        <span class="speaker-label" data-t="spokenLanguage"></span>
        <div id="speakerButtons" class="speaker-buttons" role="radiogroup"></div>
      </div>
      <div class="meter-row">
        <span data-t="level"></span>
        <div class="meter"><div id="meterFill"></div></div>
        <span id="levelText" class="mono small"></span>
      </div>
      <p id="error" class="error" hidden></p>
      <p id="trDetail" class="muted small" hidden></p>
    </section>

    <section class="card transcript-card">
      <h2 data-t="transcript"></h2>
      <div id="transcript" class="transcript"></div>
      <p id="partial" class="partial"></p>
    </section>

    <div class="side">
      <section id="perfCard" class="card" hidden>
        <h2 data-t="performance"></h2>
        <dl id="stats" class="stats"></dl>
      </section>

      <section class="card">
        <h2 data-t="listeners"></h2>
        <table class="listeners"><tbody id="listenerRows"></tbody></table>
      </section>

      <section class="card audio-quick">
        <h2 data-t="tabAudio"></h2>
        <div class="seg-control compact" role="radiogroup">
          <label><input type="radio" name="qkind" value="device"><span data-t="kindDevice"></span></label>
          <label><input type="radio" name="qkind" value="loopback"><span data-t="kindLoopback"></span></label>
          <label><input type="radio" name="qkind" value="file"><span data-t="kindFile"></span></label>
        </div>
        <div id="qDeviceRow" class="row">
          <label for="qDevice" data-t="device"></label>
          <div class="inline">
            <select id="qDevice"></select>
            <button id="qRefresh" type="button" aria-label="Refresh">↻</button>
          </div>
        </div>
        <p id="qFile" class="small muted file-name" hidden></p>
        <div class="row pair">
          <div id="qChannelBox">
            <label for="qChannel" data-t="channel"></label>
            <select id="qChannel"></select>
          </div>
          <div>
            <label for="qGain"><span data-t="gain"></span> <span id="qGainText" class="mono"></span></label>
            <input id="qGain" type="range" min="0.25" max="4" step="0.25">
          </div>
        </div>
        <p id="qStatus" class="small muted" hidden></p>
      </section>

      <section class="card vmix-quick">
        <h2>vMix</h2>
        <label class="switch-row">
          <span data-t="sendToVmix"></span>
          <button id="vmixSend" class="switch" type="button" role="switch" aria-checked="false"></button>
        </label>
        <label class="switch-row">
          <span data-t="overlay"></span>
          <button id="vmixOverlay" class="switch" type="button" role="switch" aria-checked="false"></button>
        </label>
        <p id="vmixStatus" class="small muted"></p>
        <pre id="vmixLast" class="vmix-last" hidden></pre>
      </section>
    </div>
  </main>

  <dialog id="qrDialog" class="qr-dialog">
    <h2 data-t="qrTitle"></h2>
    <img id="qrImg" alt="QR code" width="320" height="320">
    <p><a id="url" class="mono" target="_blank" rel="noopener"></a></p>
    <p id="wifiLine" class="muted"></p>
    <div class="dialog-buttons">
      <button id="qrFull" type="button" data-t="fullscreen"></button>
      <button id="qrClose" class="primary" type="button" data-t="close"></button>
    </div>
  </dialog>

  <script src="/static/admin/i18n.js"></script>
  <script src="/static/admin/common.js"></script>
  <script src="/static/admin/admin.js"></script>
</body>
</html>
