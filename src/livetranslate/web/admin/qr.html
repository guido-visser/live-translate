<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan voor vertaling</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #fff; color: #111;
      font: 400 2.2vmin/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; text-align: center; padding: 16px;
    }
    main { display: grid; gap: 2vmin; justify-items: center; }
    img { width: min(62vmin, 90vw); height: auto; image-rendering: pixelated; }
    h1 { font-size: 4vmin; margin: 0; line-height: 1.3; font-weight: 700; }
    .langs { font-size: 2.6vmin; color: #444; }
    .url { font: 600 3vmin ui-monospace, Consolas, monospace; }
    .wifi { font-size: 3vmin; }
  </style>
</head>
<body>
  <main>
    <h1>Vertaling · Переклад · Перевод · Translation</h1>
    <img id="qr" src="/api/qr.svg" alt="QR code">
    <div class="url" id="url"></div>
    <div class="wifi" id="wifi"></div>
    <div class="langs" id="langs"></div>
  </main>
  <script>
    fetch("/api/public").then((r) => r.json()).then((info) => {
      document.getElementById("url").textContent = info.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
      document.getElementById("wifi").textContent = info.wifi ? `📶 Wi-Fi: ${info.wifi}` : "";
      document.getElementById("langs").textContent = info.languages.map((l) => l.name).join(" · ");
    });
  </script>
</body>
</html>
